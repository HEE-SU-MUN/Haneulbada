.water-status{
    text-align:center;
    font-size:34px;
    font-weight:bold;
    color:#ff4b4b;
    margin-bottom:10px;
    animation:pulseStatus 1.2s infinite;
}

@keyframes pulseStatus{
    0%,100%{ opacity:1; }
    50%{ opacity:0.4; }
}

.content-center{
    flex:1;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:stretch;
    gap:45px;
}

.notice{
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:31px;
    font-weight:bold;
    color:#ffd166;
    line-height:1.6;
    padding:0 30px;
}

.empty-msg{
    text-align:center;
    font-size:30px;
    opacity:0.6;
    padding:24px;
}

#loading{
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    background:linear-gradient(160deg, #0b1f33 0%, #123a54 55%, #0e2e46 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    z-index:10;
}

#loading .spinner{
    width:56px;
    height:56px;
    border:6px solid rgba(255,255,255,0.2);
    border-top-color:#00BFFF;
    border-radius:50%;
    animation:spin 0.9s linear infinite;
    margin-bottom:20px;
}

#loading .msg{
    font-size:28px;
    opacity:0.85;
}

    to{ transform:rotate(360deg); }

<body>

<div id="loading">
    <div class="spinner"></div>
    <div class="msg">조석 데이터를 불러오는 중...</div>
</div>

<div class="box">

<h1>하나개 해수욕장 물때정보</h1>

<div class="date" id="today"></div>

<div class="water-status" id="waterStatus" style="display:none;">
    ⛔ 물이 들어오고 있습니다. ⛔
</div>

<div class="content-center">

<table id="tideTable"></table>

<div class="notice" id="notice">
    저조이후부터 물이 들어오기 시작하니 안전에 유의하여 주시기 바랍니다.
</div>

</div>

<!-- <div class="countdown" id="countdown"></div> -->

</div>

<script>

const API_URL =
  "https://apis.data.go.kr/1192136/tideFcstHghLw/GetTideFcstHghLwApiService?obsCode=DT_0093&serviceKey=b0563c720a181e67144938a7ebcfb7a8c8d18ae28bd4e417edac71792149d575&type=json";

const REFRESH_MS = 5 * 60 * 1000;   // API 갱신 주기: 5분
const URGENT_SEC = 20 * 60;         // 간조 20분 전부터 강조 표시
const MAX_ROWS = 2;                 // 현재시각 기준 가장 가까운 2개만 표시

let tideData = [];
let lastFutureCount = null;

function parseDate(str){
    let p = str.split(" ");
    let d = p[0].split("-");
    let t = p[1].split(":");
    return new Date(d[0], d[1]-1, d[2], t[0], t[1]);
}

function isHigh(t){
    return (t.extrSe=="1" || t.extrSe=="3");
}

// ---- API 호출 (실패해도 기존 데이터 유지) ----
async function fetchTideData(){
    try{
        const res = await fetch(API_URL);
        const json = await res.json();
        const items = json.body.items.item;
        if(!Array.isArray(items) || items.length===0){
            throw new Error("빈 데이터 응답");
        }
        return items;
    }catch(err){
        console.error("조석 데이터 갱신 실패, 기존 데이터 유지:", err);
        return null;
    }
}

async function loadTide(){
    const items = await fetchTideData();
    if(items){
        tideData = items;
    }
    showTable();
}

// ---- 간조 이후 ~ 다음 만조 전까지 "물이 들어오고 있습니다" 상태 표시 ----
function updateWaterStatus(){
    const statusEl = document.getElementById("waterStatus");
    if(!statusEl) return;

    let now = new Date();
    let past = tideData.filter(t => parseDate(t.predcDt) <= now);

    if(past.length === 0){
        statusEl.style.display = "none";
        return;
    }

    // 지난 이벤트 중 가장 최근 것
    let lastEvent = past.reduce((a,b) =>
        parseDate(a.predcDt) > parseDate(b.predcDt) ? a : b
    );

    // 가장 최근이 간조였다면 -> 지금은 물이 들어오는 구간
    if(!isHigh(lastEvent)){
        statusEl.style.display = "block";
    }else{
        statusEl.style.display = "none";
    }
}

// ---- 표 렌더링: 지난 시각 제외, 최대 MAX_ROWS개 ----
function showTable(){
    let now = new Date();
    let future = tideData
        .filter(t => parseDate(t.predcDt) > now)
        .slice(0, MAX_ROWS);

    lastFutureCount = future.length;

    if(future.length === 0){
        document.getElementById("tideTable").innerHTML =
            `<tr><td colspan="3" class="empty-msg">표시할 예정 데이터가 없습니다</td></tr>`;
    }else{
        let html = "";
        future.forEach(t=>{
            let high = isHigh(t);
            let timeOnly = t.predcDt.split(" ")[1]; // "HH:mm"만 추출
            html += `
                <tr>
                    <td class="${high?'high':'low'}">${high?'물 빠지는 시간 (고조)':'물 들어오는 시간 (저조)'}</td>
                    <td>${timeOnly}</td>
                    <td>${t.predcTdlvVl} cm</td>
                </tr>
            `;
        });
        document.getElementById("tideTable").innerHTML = html;
    }

    const weekdayNames = ["일","월","화","수","목","금","토"];
    document.getElementById("today").innerHTML =
        now.getFullYear()+"-"+
        String(now.getMonth()+1).padStart(2,"0")+"-"+
        String(now.getDate()).padStart(2,"0")+
        " ("+weekdayNames[now.getDay()]+")";
}

// 매초 지난 시각이 생겼는지 가볍게 체크 -> 필요할 때만 표 다시 그림 (깜빡임 방지)
function checkTableRefresh(){
    let now = new Date();
    let futureCount = tideData
        .filter(t => parseDate(t.predcDt) > now)
        .slice(0, MAX_ROWS).length;

    if(futureCount !== lastFutureCount){
        showTable();
    }
}

function tick(){
    // updateCountdown(); // 카운트다운 기능 임시 비활성화
    checkTableRefresh();
    updateWaterStatus();
}

async function init(){
    await loadTide();
    // updateCountdown(); // 카운트다운 기능 임시 비활성화
    updateWaterStatus();

    // 최초 로딩 완료 -> 로딩 화면 제거
    const loadingEl = document.getElementById("loading");
    if(loadingEl) loadingEl.remove();

    setInterval(tick, 1000);           // 지난시각 필터링용, 1초마다 (인터벌 딱 1번만 등록)
    setInterval(loadTide, REFRESH_MS); // API 재호출, 5분마다 (위 인터벌과 완전히 독립)
}

init();

</script>

</body>
</html>
