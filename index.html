            overflow: auto;

                160deg,

        .box {
            width: 1200px;

            box-sizing: border-box;
            padding: 20px 50px;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            font-size: 70px;
            margin: 10px 0 4px;
            letter-spacing: 2px;
        }

        .date {
            text-align: center;
            font-size: 60px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #cfe8ff;
        }

        .badatime-frame-wrap {
            width: calc(100% - 80px);
            margin: 30px auto;
            flex: 1;
            min-height: 0;
            overflow: hidden;
            border-radius: 12px;
            position: relative;
            background: #fff;
            margin-bottom: 50px;
        }

        .badatime-frame {
            position: absolute;
            border: none;
            width: 1800px;
            height: 1200px;
            top: -1030px;
            left: -3441px;
            transform: scale(3.7);
            transform-origin: top left;
        }

        /* ---- 밀물/썰물 상태 경광등 ---- */
        .tide-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            margin-bottom: -30px;
            font-size: 50px;
            font-weight: bold;
        }

        .tide-status .beacon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            animation: beaconBlink 1s infinite;
        }

        .tide-status.rising .beacon {
            background: #ff3b3b;
            box-shadow: 0 0 22px 6px rgba(255, 59, 59, 0.8);
        }

        .tide-status.rising .status-text {
            color: #ff3b3b;
        }

        .tide-status.falling .beacon {
            background: #2ecc71;
            box-shadow: 0 0 22px 6px rgba(46, 204, 113, 0.8);
        }

        .tide-status.falling .status-text {
            color: #2ecc71;
        }

        @keyframes beaconBlink {
            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.25;
            }
        }

        .content-center {
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: stretch;
            gap: 45px;
        }

        .notice {
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 45px;
            font-weight: bold;
            color: #ffd166;
            line-height: 1.6;
            padding: 0 30px;
            margin-top: 0 auto;
        }

        .empty-msg {
            text-align: center;
            font-size: 30px;
            opacity: 0.6;
            padding: 24px;
        }

        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                160deg,
                #0b1f33 0%,
                #123a54 55%,
                #0e2e46 100%
            );
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }

        #loading .spinner {
            width: 56px;
            height: 56px;
            border: 6px solid rgba(255, 255, 255, 0.2);
            border-top-color: #00bfff;
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 20px;
        }

        #loading .msg {
            font-size: 28px;
            opacity: 0.85;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

<body>

    <div id="loading">
        <div class="spinner"></div>
        <div class="msg">조석 데이터를 불러오는 중...</div>
    </div>

    <div class="box">

        <h1>하나개 해수욕장 물때정보</h1>

        <div class="date" id="today"></div>

        <div class="tide-status" id="tideStatus" style="display: none;">
            <span class="beacon"></span>
            <span class="status-text" id="statusText"></span>
        </div>

        <div class="content-center">

            <div class="badatime-frame-wrap">
                <iframe
                    id="badaFrame"
                    class="badatime-frame"
                    src="https://www.badatime.com/155/daily"
                    title="대무의도 물때 그래프"
                    loading="eager"
                ></iframe>
            </div>

            <div class="notice" id="notice">
                저조(간조) 이후부터 물이 들어오기 시작하니<br>
                안전에 유의하여 주시기 바랍니다.
            </div>

        </div>

        <!-- <div class="countdown" id="countdown"></div> -->

    </div>

    <script>
        const API_URL =
            "https://apis.data.go.kr/1192136/tideFcstHghLw/GetTideFcstHghLwApiService?obsCode=DT_0093&serviceKey=b0563c720a181e67144938a7ebcfb7a8c8d18ae28bd4e417edac71792149d575&type=json";

        const REFRESH_MS = 5 * 60 * 1000; // API 갱신 주기: 5분
        const URGENT_SEC = 20 * 60;       // 간조 20분 전부터 강조 표시

        let tideData = [];

        // ---- 테스트용 시간 오프셋 ----
        // URL에 ?testTime=2026-07-29T22:30:00 을 붙이면
        // 그 시각부터 실시간처럼 흘러갑니다.
        //
        // 예)
        // tide_board.html?testTime=2026-07-29T22:50:00

        const TIME_OFFSET_MS = (() => {
            const params = new URLSearchParams(window.location.search);
            const testTime = params.get("testTime");

            if (!testTime) {
                return 0;
            }

            const target = new Date(testTime);

            if (isNaN(target.getTime())) {
                return 0;
            }

            console.warn(
                "⚠ 테스트 모드: 기준 시각을",
                target.toString(),
                "로 설정함"
            );

            return target.getTime() - Date.now();
        })();

        function getNow() {
            return new Date(Date.now() + TIME_OFFSET_MS);
        }

        function parseDate(str) {
            let p = str.split(" ");
            let d = p[0].split("-");
            let t = p[1].split(":");

            return new Date(
                d[0],
                d[1] - 1,
                d[2],
                t[0],
                t[1]
            );
        }

        function isHigh(t) {
            return t.extrSe == "1" || t.extrSe == "3";
        }

        // ---- API 호출 (실패해도 기존 데이터 유지) ----
        async function fetchTideData() {
            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                const items = json.body.items.item;

                if (!Array.isArray(items) || items.length === 0) {
                    throw new Error("빈 데이터 응답");
                }

                return items;

            } catch (err) {
                console.error(
                    "조석 데이터 갱신 실패, 기존 데이터 유지:",
                    err
                );

                return null;
            }
        }

        async function loadTide() {
            const items = await fetchTideData();

            if (items) {
                tideData = items;
            }

            updateDateDisplay();
            updateTideStatus();
        }

        // ---- 날짜 표시 (요일 포함) ----
        function updateDateDisplay() {
            let now = getNow();

            const weekdayNames = [
                "일",
                "월",
                "화",
                "수",
                "목",
                "금",
                "토"
            ];

            document.getElementById("today").innerHTML =
                now.getFullYear() +
                "-" +
                String(now.getMonth() + 1).padStart(2, "0") +
                "-" +
                String(now.getDate()).padStart(2, "0") +
                " (" +
                weekdayNames[now.getDay()] +
                ")";
        }

        // ---- 현재 밀물(rising) / 썰물(falling) 상태 판별 ----
        function getTideState() {
            let now = getNow();

            let past = tideData.filter(
                t => parseDate(t.predcDt) <= now
            );

            let future = tideData.filter(
                t => parseDate(t.predcDt) > now
            );

            // 기준 1순위: 가장 최근에 지난 이벤트
            if (past.length > 0) {
                let lastEvent = past.reduce(
                    (a, b) =>
                        parseDate(a.predcDt) >
                        parseDate(b.predcDt)
                            ? a
                            : b
                );

                // 마지막이 만조(고조)였다면 -> 지금은 썰물
                // 마지막이 간조(저조)였다면 -> 지금은 밀물
                return isHigh(lastEvent)
                    ? "falling"
                    : "rising";
            }

            // 지난 이벤트가 없을 때(데이터 시작 지점 등)는
            // 다음 이벤트로 역산
            if (future.length > 0) {
                let nextEvent = future.reduce(
                    (a, b) =>
                        parseDate(a.predcDt) <
                        parseDate(b.predcDt)
                            ? a
                            : b
                );

                return isHigh(nextEvent)
                    ? "rising"
                    : "falling";
            }

            return null;
        }

        // ---- 상태 경광등 갱신 ----
        function updateTideStatus() {
            const el = document.getElementById("tideStatus");
            const textEl = document.getElementById("statusText");

            if (!el || !textEl) {
                return;
            }

            let state = getTideState();

            if (!state) {
                el.style.display = "none";
                return;
            }

            el.style.display = "flex";

            el.classList.remove(
                "rising",
                "falling"
            );

            el.classList.add(state);

            textEl.textContent =
                state === "rising"
                    ? "현재 밀물 상태"
                    : "현재 썰물 상태";
        }

            let diff = target - new Date();

            if (diff < 0) {

                            nextLow = {
                                time: time,
                                height: t.predcTdlvVl
                            };
                        }
                    }
                }
            });

            let text = "";

                let r = remain(nextHigh.time);

                            })}

                        </div>
                    </div>
                `;
            }

                text += `
                    <div class="block">
                        <div class="label">
                            🌊 물 들어오는 시간
                            <span class="sub">(다음 간조)</span>
                        </div>

                        <div class="info">
                            ${nextLow.time.toLocaleTimeString([], {
                                hour: "2-digit",
                                minute: "2-digit"
                            })}
                            (${nextLow.height}cm)
                        </div>

                        <div class="timer ${urgent ? "urgent" : ""}">
                            ⏱ ${r.text}
                            ${urgent ? " · 곧 물이 들어옵니다" : ""}
                        </div>
                    </div>
                `;
            }

            document.getElementById("countdown").innerHTML = text;
        }
        */

        function tick() {
            // updateCountdown(); // 카운트다운 기능 임시 비활성화
            updateTideStatus();
        }

        async function init() {
            await loadTide();

            // updateCountdown(); // 카운트다운 기능 임시 비활성화
            updateTideStatus();

            // 최초 로딩 완료 -> 로딩 화면 제거
            const loadingEl =
                document.getElementById("loading");

            if (loadingEl) {
                loadingEl.remove();
            }

            // 지난시각 필터링용, 1초마다
            // 인터벌 딱 1번만 등록
            setInterval(tick, 1000);

            // API 재호출, 5분마다
            // 위 인터벌과 완전히 독립
            setInterval(loadTide, REFRESH_MS);
        }

        init();
    </script>

</body>
